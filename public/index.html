<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#ffffff">
 <meta name="description" content="Five daily rounds. Pick the biggest statistic and earn its value in points.">
 <title>Go Figure — The daily stats guessing game</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2048%22%3E%3Cg%20fill%3D%22%23262626%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2235%22%20height%3D%228%22%20rx%3D%223%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2214%22%20width%3D%2251%22%20height%3D%228%22%20rx%3D%223%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2226%22%20width%3D%2239%22%20height%3D%228%22%20rx%3D%223%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2238%22%20width%3D%2228%22%20height%3D%228%22%20rx%3D%223%22%2F%3E%3Cpath%20d%3D%22M56%2018l7-5v10z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
 <link rel="stylesheet" href="style.css">
 <script type="module" src="app.js"></script>
</head>
<body>
 <header class="site-header">
  <div class="header-inner">
   <button id="help" class="icon-button" aria-label="How to play"><span class="help-icon" aria-hidden="true">?</span></button>
   <h1 class="brand"><a href="./" aria-label="Go Figure home"><img class="brand-mark" src="assets/go-figure-logo.svg" alt="" width="40" height="30">Go Figure</a></h1>
   <button id="stats" class="icon-button" aria-label="Your statistics"><span class="mini-bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </div>
 </header>
 <main class="shell">
  <p class="instructions">Pick the biggest statistic. Your pick = your points.</p>
  <section class="game" aria-label="Daily game">
   <div class="game-top">
    <div><span class="sr-only" id="edition"></span><span class="date" id="date"></span></div>
    <div class="score">Score <strong id="score">0</strong></div>
   </div>
   <div class="round-strip">
    <span id="round-label"></span>
    <div id="progress" class="progress" aria-label="Round progress"></div>
    <span id="round-status" class="sr-only"></span>
   </div>
   <div id="play"></div>
  </section>
  <footer>
   <button id="rules-link" class="text-button">How to play</button>
   <span>Next game in <strong id="countdown">--:--:--</strong></span>
  </footer>
  <section id="behind-numbers" class="sources" aria-labelledby="sources-title" hidden></section>
 </main>
 <dialog id="modal"><button class="close" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog>
 <div role="status" id="toast"></div>
</body>
</html>
