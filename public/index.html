<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#ffffff">
 <meta name="description" content="Five daily rounds. Pick the biggest statistic and earn its value in points.">
 <title>Go Figure — The daily stats guessing game</title>
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23262626'/%3E%3Cpath d='M10 28V19h5v9m3 0V13h5v15m3 0V7h5v21' fill='%23fff'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="style.css">
 <script type="module" src="app.js"></script>
</head>
<body>
 <header class="site-header">
  <div class="header-inner">
   <button id="help" class="icon-button" aria-label="How to play"><span class="help-icon" aria-hidden="true">?</span></button>
   <h1 class="brand"><a href="./" aria-label="Go Figure home">Go Figure</a></h1>
   <button id="stats" class="icon-button" aria-label="Your statistics"><span class="mini-bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </div>
 </header>
 <main class="shell">
  <p class="instructions">Pick the biggest statistic. Your pick = your points.</p>
  <section class="game" aria-label="Daily game">
   <div class="game-top">
    <div><span class="sr-only" id="edition"></span><span class="date" id="date"></span></div>
    <div class="score">Score <strong id="score">0</strong></div>
   </div>
   <div class="round-strip">
    <span id="round-label"></span>
    <div id="progress" class="progress" aria-label="Round progress"></div>
    <span id="round-status" class="sr-only"></span>
   </div>
   <div id="play"></div>
  </section>
  <footer>
   <button id="rules-link" class="text-button">How to play</button>
   <span>Next game in <strong id="countdown">--:--:--</strong></span>
  </footer>
  <section id="behind-numbers" class="sources" aria-labelledby="sources-title" hidden></section>
 </main>
 <dialog id="modal"><button class="close" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog>
 <div role="status" id="toast"></div>
</body>
</html>
